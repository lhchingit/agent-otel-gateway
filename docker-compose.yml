services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.33.0   # pinned: we mount into image-internal paths and rely on its HEALTHCHECK
    restart: unless-stopped
    ports:
      - "3000:3000"   # Grafana (anonymous admin enabled by the image)
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/ai-agents.json
    volumes:
      - ./grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ai-agents.yaml:ro
      - ./grafana/dashboards/ai-agents.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/ai-agents.json:ro
      - lgtm-data:/data
    # The image declares its own HEALTHCHECK (Grafana, Loki, Tempo, Prometheus, internal collector).

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP (default for the agents)
      - "8889:8889"    # Prometheus scrape endpoint
      - "13133:13133"  # health_check extension
    depends_on:
      otel-lgtm:
        condition: service_healthy

  # Pushes pricing/prices.csv to the gateway every 60s as llm_price_per_mtok{model,type};
  # the dashboard multiplies tokens by it for estimated cost. Edit the CSV, no restart needed.
  # On Kubernetes: same image + script as a sidecar, with the CSV mounted from a ConfigMap.
  llm-pricing:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/pricing/push-prices.sh"]
    environment:
      ENDPOINT: http://otel-collector:4318
      PRICES_FILE: /pricing/prices.csv
      INTERVAL: "60"
    volumes:
      - ./pricing:/pricing:ro
    depends_on:
      - otel-collector

volumes:
  lgtm-data:
